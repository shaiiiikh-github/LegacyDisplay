name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version

      - name: Discover Available iOS Simulator
        id: sim
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available | grep -E 'iPhone 1[4-6]' | head -n 1 | sed -E 's/^[[:space:]]*([A-Za-z0-9 ]+) \(.*/\1/' | xargs)
          if [ -z "$DEVICE_NAME" ]; then
            DEVICE_NAME="iPhone 15"
          fi
          echo "Discovered simulator: $DEVICE_NAME"
          echo "device=$DEVICE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build Application
        run: |
          xcodebuild clean build \
            -project LegacyDisplay.xcodeproj \
            -scheme LegacyDisplay \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project LegacyDisplay.xcodeproj \
            -scheme LegacyDisplay \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
